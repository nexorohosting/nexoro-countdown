<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support | Nexoro Hosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --accent-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-dim: #8e8e93;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem 10%; background: rgba(0,0,0,0.9);
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }
        .logo { font-family: 'Orbitron'; font-weight: 900; color: #fff; text-decoration: none; font-size: 1.5rem; }
        .logo span { color: var(--accent-cyan); }

        /* --- CONTACT WRAPPER --- */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            padding: 5rem 10%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .contact-info h1 {
            font-family: 'Orbitron';
            font-size: 3rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .contact-info p { color: var(--text-dim); margin-bottom: 3rem; line-height: 1.6; }

        .contact-method {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 2rem;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            transition: 0.3s;
        }

        .contact-method:hover { border-color: var(--accent-cyan); background: rgba(0, 243, 255, 0.03); }

        .method-icon {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            font-family: 'Orbitron';
        }

        /* --- FORM STYLING --- */
        .contact-form {
            background: rgba(255, 255, 255, 0.03);
            padding: 3rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Cyan corner accents */
        .contact-form::before {
            content: ""; position: absolute; top: -1px; left: -1px; width: 30px; height: 30px;
            border-top: 2px solid var(--accent-cyan); border-left: 2px solid var(--accent-cyan);
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--accent-cyan); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 4px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus { border-color: var(--accent-cyan); background: rgba(0, 243, 255, 0.05); }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            font-family: 'Orbitron';
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .submit-btn:hover { box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); transform: translateY(-2px); }

        @media (max-width: 900px) {
            .contact-container { grid-template-columns: 1fr; padding: 3rem 5%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">NEXORO<span>.</span></a>
        <div style="display:flex; gap: 20px;">
            <a href="index.html" style="color:white; text-decoration:none;">Home</a>
            <a href="about.html" style="color:white; text-decoration:none;">About</a>
        </div>
    </nav>

    <main class="contact-container">
        
        <div class="contact-info">
            <h1>Open a Comms Link</h1>
            <p>Have a technical question or need help scaling your community? Our tactical support team is ready to assist.</p>
            
            <div class="contact-method">
                <div class="method-icon">#</div>
                <div>
                    <h3 style="font-family: 'Orbitron'; font-size: 0.9rem;">Join Discord</h3>
                    <p style="font-size: 0.8rem; margin-bottom: 0;">Instant ticket support & community chat.</p>
                </div>
            </div>

            <div class="contact-method">
                <div class="method-icon">@</div>
                <div>
                    <h3 style="font-family: 'Orbitron'; font-size: 0.9rem;">Email Support</h3>
                    <p style="font-size: 0.8rem; margin-bottom: 0;">support@nexoro-hosting.com</p>
                </div>
            </div>
        </div>

        <div class="contact-form">
            <form>
                <div class="form-group">
                    <label>Inquiry Type</label>
                    <select>
                        <option>Technical Support</option>
                        <option>Billing Question</option>
                        <option>Partnership/Media</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Transmission Message</label>
                    <textarea rows="5" placeholder="Describe your request in detail..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Transmission</button>
            </form>
        </div>

    </main>

</body>
</html>
