<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Nexoro Hosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        /* (REUSE CSS FROM LOGIN PAGE) */
        :root { --bg-dark: #050505; --accent-cyan: #00f3ff; --text-main: #ffffff; --text-dim: #8e8e93; --card-bg: rgba(255, 255, 255, 0.03); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.07) 0%, transparent 70%); }
        .auth-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); padding: 3rem; border-radius: 15px; width: 100%; max-width: 450px; backdrop-filter: blur(10px); }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header h1 { font-family: 'Orbitron'; font-size: 1.5rem; letter-spacing: 2px; color: var(--accent-cyan); }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-family: 'Orbitron'; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 4px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent-cyan); }
        .btn-auth { width: 100%; padding: 14px; background: var(--accent-cyan); color: #000; border: none; font-family: 'Orbitron'; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 4px; margin-top: 1rem; }
        .auth-footer { text-align: center; margin-top: 2rem; font-size: 0.85rem; color: var(--text-dim); }
        .auth-footer a { color: var(--accent-cyan); text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h1>CREATE ACCOUNT</h1>
            <p>Join the Nexoro Infrastructure</p>
        </div>

        <form>
            <div style="display: flex; gap: 15px;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Steve_NX">
                </div>
                <div class="form-group">
                    <label>Discord ID</label>
                    <input type="text" placeholder="steve#0000">
                </div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="commander@nexoro.com">
            </div>
            <div class="form-group">
                <label>Access Password</label>
                <input type="password" placeholder="Create complex password">
            </div>
            
            <p style="font-size: 0.7rem; color: #555; margin-bottom: 1rem;">
                By clicking sign up, you agree to our <a href="legal.html" style="color: #777;">Terms of Service</a>.
            </p>

            <button type="submit" class="btn-auth">Register operative</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

</body>
</html>
