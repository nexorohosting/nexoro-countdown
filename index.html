<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexoro Hosting - Launching Soon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="container">
        <div class="logo-area">
            <h1>NEXORO <span class="highlight">HOSTING</span></h1>
            <p class="tagline">Premium Minecraft Bedrock Hosting Solutions</p>
        </div>

        <div class="content">
            <h2>We are launching in</h2>
            
            <div class="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>
            </div>

            <p class="info-text">
                Prepare for high-performance Docker isolation, custom panels, and seamless scaling.
            </p>

            <div class="buttons">
                <a href="#" class="btn discord-btn">Join Discord</a>
                <a href="waitlist.html" class="btn waitlist-btn">Join Waitlist</a>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 Nexoro Hosting. Managed by STK Gamer, TG, and Machi.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
