<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Waitlist - Nexoro Hosting</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-overlay"></div>

    <div class="container">
        <div class="waitlist-box">
            <h1>Secure Your <span class="highlight">Spot</span></h1>
            
            <div class="promo-banner">
                <p>🔥 <strong>The first 15 users</strong> will receive a code for <strong>50% OFF</strong> any hosting plan!</p>
            </div>

            <p class="subtext">Enter your details below to be notified when we launch.</p>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {window.location='#';}"></iframe>

<form id="waitlistForm" 
      action="'https://docs.google.com/forms/d/e/1FAIpQLSfdbUvkuT2M0mweylTxjPYrVcCyYns0NnyatLDFha6ooRvIRw/viewform?usp=pp_url&entry.1423420749=testuser&entry.2029535889=test@email.com';" 
      method="POST" 
      target="hidden_iframe"
      onsubmit="submitted=true;">

    <div class="input-group">
        <label for="username">Username (Discord/Minecraft)</label>
        <input type="text" name="entry.1423420749" placeholder="e.g. STKGamer" required>
    </div>

    <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" name="entry.2029535889" placeholder="you@example.com" required>
    </div>

    <button type="submit" class="btn discord-btn full-width">Join the List</button>
</form>

<div id="successMessage" class="hidden">
    <h3>✅ You're on the list!</h3>
    <p>Keep an eye on your email. We launch Dec 31st.</p>
</div>

            </div>

            <br>
            <a href="index.html" class="back-link">← Back to Countdown</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
